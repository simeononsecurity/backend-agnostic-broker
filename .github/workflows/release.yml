# Release workflow. Runs ONLY on approved tags (not on PRs), uses separate
# least-privilege permissions, builds immutable image tags, and does NOT publish
# images by default — publishing is gated behind an explicit, manual approval
# environment. Release credentials never exist in PR jobs (this file never runs
# on pull_request).
name: release

on:
  push:
    tags:
      - "v*.*.*"      # protected/approved tags only
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish image to registry (requires approval environment)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: "Derive immutable version"
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # REF_NAME is the tag (e.g. v1.2.3); sanitize to a bare semver.
          VER="${REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: "Build immutable image (no push)"
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          load: true
          push: false
          tags: backend-agnostic-broker:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
      - name: "Container smoke test"
        run: bash scripts/docker_smoke.sh backend-agnostic-broker:${{ steps.meta.outputs.version }}
      - name: "Trivy gate"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: backend-agnostic-broker:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    # Publishing requires BOTH an explicit opt-in AND a protected environment
    # whose required reviewers must approve. Release secrets live only here.
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: release-approval   # configure required reviewers in repo settings
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Publish placeholder (no-op until registry configured)"
        run: |
          echo "Would publish backend-agnostic-broker:${{ needs.build.outputs.version }}"
          echo "Registry login + push intentionally omitted; configure secrets in"
          echo "the 'release-approval' environment and add a push step when ready."
