# Example model registry for backend-agnostic-broker.
# Copy to registry.yaml and edit. Requests select a model by its `alias`.
# NOTE: paths/URLs below are placeholders — no real host details are committed.
#
# Env-var substitution: any `${VAR}` or `${VAR:-default}` is expanded from the
# environment (e.g. .env / Docker secret) when the registry loads. Use it to keep
# host IPs and endpoints OUT of version control — set them in a gitignored .env
# instead. Example: a remote Ollama daemon reached via `${OLLAMA_BASE_URL}`.

# ---- Auto-router policy (optional): controls the "auto" model id -------------
# Clients send {"model": "auto", ...} and a tiny classifier picks the best model
# below for each request. Every knob is DATA (no code): per-model
# tags/description/priority/cost_tier/router_eligible (set on each model), plus
# the policy/default/weights/overrides here. See docs/auto-router.md.
router:
  # Deterministic fallback model id, used when the classifier returns an invalid
  # or empty choice. Must be one of the model aliases / pool names below.
  default: echo-fake

  # Optional: REPLACE the classifier's system prompt (the instructions the tiny
  # LLM receives). Unset = the built-in policy: "prefer the cheapest clearly
  # capable model; prefer an already-loaded model on a tie." Set it to bias the
  # LLM, e.g. toward quality over cost. (Ignored by the heuristic backend.)
  # policy: >-
  #   You are a model router. Prefer the highest-quality capable model; only pick
  #   a cheaper one for trivial requests. Reply with ONLY the model id.

  # Heuristic-backend scoring weights (also used on LLM fallback). Capability
  # match dominates by default; raise `cost` to push cheaper models harder,
  # `prefer_loaded` to favor already-loaded models, `priority` to weight each
  # model's `priority` field. `cost_normalized` (default true since v0.6.0)
  # normalizes the cost term to [0,1]·cost so one capability match always wins
  # over price. Without it (v0.5.0 scoring, `false`), once the cheapest model is
  # warm its cost + prefer_loaded bonus outweighs capability and it receives
  # code/math/reasoning prompts (blind-set accuracy 0.75 -> 0.36).
  weights:
    { capability: 3.0, cost: 1.0, prefer_loaded: 1.0, priority: 1.0, cost_normalized: true }

  # --- Cascade mode (opt-in; ADR 0011 + 0019) --------------------------------
  # "single" (default) = one-shot classification. "cascade" = serve the cheapest
  # capable model first, inspect its ACTUAL answer, and escalate ONCE to a stronger
  # capable model when a signal fires (see docs/auto-router.md).
  # mode: cascade
  # cascade:
  #   escalate_on_length: true     # first hop truncated (finish_reason == "length")
  #   escalate_on_empty: true      # empty / too-short answer
  #   min_chars: 1                 # shorter than this (stripped) => escalate
  #   escalate_on_refusal: true    # answer matches a refusal pattern
  #   refusal_patterns: ["(?i)\\bI\\s+cannot\\b", "(?i)as an AI\\b"]
  #   # Streaming (ADR 0019): "fallback_single" (default) serves the single strong
  #   # pick; "buffer" makes the chat endpoint buffer the cheap hop, score it, then
  #   # replay it or stream the stronger hop (never mixing two models in a stream).
  #   stream_mode: fallback_single
  #   # Calibrated reliability scorer (ADR 0019, opt-in): one tunable threshold in
  #   # place of the booleans. Graded features (length + optional token logprobs)
  #   # with hard refusal/truncation gates; escalate when score < threshold.
  #   scorer:
  #     enabled: false
  #     threshold: 0.5             # escalate when reliability < 0.5
  #     target_chars: 200          # length (stripped) at which length-feature = 1
  #     weight_length: 1.0
  #     weight_logprob: 0.0        # >0 uses token logprobs when present
  #     gate_refusal: true         # a refusal always escalates
  #     gate_truncation: true      # finish_reason == "length" always escalates

  # --- Latency budget (opt-in; ADR 0011) -------------------------------------
  # Default per-request latency budget in ms. If the chosen model's estimated
  # latency (usage-log p90 + a cold-start penalty for a not-resident model)
  # exceeds the budget, a faster CAPABLE model is picked instead (never below the
  # capability/placement filters). The x-broker-latency-budget-ms header wins over
  # this; BROKER_ROUTER_LATENCY_BUDGET_MS is the final fallback.
  # latency_budget_ms: 2000

  # Hard rules, evaluated IN ORDER, BEFORE the classifier. The first rule whose
  # conditions ALL match wins and bypasses the LLM. A rule is skipped if its
  # target can't actually serve the request (e.g. no vision for an image), so an
  # override can never force an incapable model.
  # `when` keys: has_images, has_tools, needs_json, min_ctx_tokens, regex
  # (regex is searched — case-insensitively via the pattern — on the last user msg).
  overrides:
    - when: { has_tools: true }               # tool / function-calling requests
      use: llama3-ollama                       #   -> a model with supports_tools: true
    - when: { min_ctx_tokens: 32000 }          # very long inputs
      use: mistral-vllm                        #   -> a model with a big context_limit
    - when: { regex: "(?i)\\btranslate\\b" }   # keyword match on the request text
      use: echo-fake
    # Image requests need a vision model (set supports_vision: true on one); e.g.:
    # - when: { has_images: true }
    #   use: my-vision-model

# ---- Per-model pricing (optional): powers per-key COST budgets (ADR 0008) ----
# Prices are USD per MILLION tokens, split into input (prompt) and output
# (completion), keyed by the PUBLIC model name (a pool name, or a standalone
# alias; use "auto" is NOT needed — the served model is what gets priced).
# A key's cost budget (python -m broker.keys create --daily-cost / --monthly-cost)
# is charged `prompt*input + completion*output`. Models without an entry here are
# treated as free, so cost budgets simply don't apply to them. Token budgets
# (--daily-tokens / --monthly-tokens) need no pricing. Leave this out entirely if
# you only use rpm/tpm/token budgets.
pricing:
  chat:                      # the "chat" pool below
    input_per_million: 0.20
    output_per_million: 0.60
  echo-fake:                 # example standalone alias
    input_per_million: 0.0
    output_per_million: 0.0

models:
  # ---- Fake backend (no external runtime; used for tests & smoke) ----------
  - alias: echo-fake
    backend: fake
    runtime_model_id: fake-echo-v1
    context_limit: 8192
    output_limit: 2048
    idle_timeout_seconds: 60
    supports_streaming: true
    # ---- Auto-router metadata (used only by the "auto" alias) ----
    tags: [general, cheap, fast]       # class tags: matched against the request and
                                       # shown to the classifier (e.g. code, vision,
                                       # reasoning, long-context, tools, json)
    description: fake echo backend for tests   # one-line hint shown in the candidate table
    cost_tier: 1                       # 1 (cheapest) .. 5 (priciest); router prefers cheaper
    priority: 0                        # tie-break bias; higher = preferred on a tie
    router_eligible: true              # set false to exclude this model from "auto"
    # Placement/data-residency labels (opt-in, fail-closed; ADR 0011). A request
    # carrying a placement requirement (x-broker-placement header or
    # BROKER_DEFAULT_PLACEMENT) is only served by models/pool members that carry
    # ALL required labels; otherwise 403 placement_denied (never spills). e.g.:
    placement: [local, trusted]        # this fake model runs in-process = local/trusted

  # ---- Ollama (external daemon, native lazy loading via keep_alive) ---------
  # base_url is injected from the environment so no host IP is committed. Point
  # OLLAMA_BASE_URL at a local or remote (e.g. tailscale) Ollama daemon.
  - alias: llama3-ollama
    backend: ollama
    runtime_model_id: llama3.1:8b
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    context_limit: 8192
    output_limit: 2048
    idle_timeout_seconds: 300
    keep_alive: "5m"
    tags: [general, code, reasoning]
    description: general-purpose 8B chat/code model
    cost_tier: 3
    priority: 1                        # prefer over equal-scoring cheaper models
    readiness:
      kind: http
      path: /api/tags
      expect_status: 200
    supports_streaming: true
    supports_tools: true

  # ---- Ollama embedding model (POST /v1/embeddings) -------------------------
  # Embedding models are addressed by name on /v1/embeddings (never via `auto` —
  # there is nothing to classify). Ollama entries are translated to the native
  # /api/embed; vLLM/llama.cpp are proxied to their OpenAI /v1/embeddings.
  - alias: nomic-embed-text
    backend: ollama
    runtime_model_id: nomic-embed-text   # must be pulled on the Ollama daemon
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    context_limit: 8192
    output_limit: 512
    idle_timeout_seconds: 300
    keep_alive: "5m"
    tags: [embedding]
    description: nomic-embed-text embedding model (768-dim)
    router_eligible: false               # not a chat model; never a router target
    readiness:
      kind: http
      path: /api/tags
      expect_status: 200

  # ---- llama.cpp reranker (POST /v1/rerank; ADR 0013) ----------------------
  # Reranker models are addressed by name on /v1/rerank (never via `auto`). Run
  # llama-server with --reranking --pooling rank and a reranker GGUF (e.g.
  # bge-reranker-v2-m3); vLLM reranker models work the same way. Set
  # supports_rerank: true so /v1/models advertises it and non-rerank models 400.
  # Ollama/Strata rerank is NOT supported and returns 400.
  - alias: bge-reranker
    backend: llamacpp
    runtime_model_id: bge-reranker-v2-m3
    model_path: /models/bge-reranker-v2-m3-q8_0.gguf
    base_url: http://127.0.0.1:8082
    context_limit: 512
    output_limit: 1
    idle_timeout_seconds: 300
    supports_rerank: true          # <- enables POST /v1/rerank for this model
    router_eligible: false         # not a chat model; never a router target
    tags: [rerank]
    description: bge-reranker-v2-m3 cross-encoder reranker
    startup_command:
      - /usr/local/bin/llama-server
      - --model
      - "{model_path}"
      - --host
      - 127.0.0.1
      - --port
      - "8082"
      - --reranking
      - --pooling
      - rank
      - --n-gpu-layers
      - "{layer_split}"
    readiness:
      kind: http
      path: /health
      expect_status: 200
      timeout_seconds: 120
    gpu:
      required: true
      device_ids: [0]
      layer_split: "99"
      # Take an EXCLUSIVE device lease when loaded (ADR 0026; needs
      # BROKER_DEVICE_LEASES=on). The model refuses to co-reside on device 0: an
      # idle broker model there is evicted, but a busy broker model or an external
      # holder makes the load fail with 503 device_busy + Retry-After. Other
      # models take a shared lease. See docs/device-leases.md.
      exclusive: true

  # ---- llama.cpp (broker-managed process; model loads at startup) -----------
  - alias: qwen-llamacpp
    backend: llamacpp
    runtime_model_id: qwen2.5-7b-instruct
    model_path: /models/qwen2.5-7b-instruct-q4_k_m.gguf
    base_url: http://127.0.0.1:8081
    context_limit: 8192
    output_limit: 2048
    idle_timeout_seconds: 300
    tags: [code, reasoning]
    description: strong at code and debugging
    cost_tier: 3
    # argv TEMPLATE. {exe}/{model_path}/{context_limit}/{tensor_split}/{layer_split}
    # are substituted by the broker; no request can inject flags.
    startup_command:
      - /usr/local/bin/llama-server
      - --model
      - "{model_path}"
      - --host
      - 127.0.0.1
      - --port
      - "8081"
      - --ctx-size
      - "{context_limit}"
      - --n-gpu-layers
      - "{layer_split}"
    readiness:
      kind: http
      path: /health
      expect_status: 200
      timeout_seconds: 120
    gpu:
      required: true
      device_ids: [0]
      layer_split: "35"          # n-gpu-layers
      tensor_split: [1.0]
    supports_streaming: true

  # ---- vLLM (broker-managed process; one model per process) ----------------
  - alias: mistral-vllm
    backend: vllm
    runtime_model_id: mistralai/Mistral-7B-Instruct-v0.3
    model_path: /models/Mistral-7B-Instruct-v0.3
    base_url: http://127.0.0.1:8000
    context_limit: 32768
    output_limit: 4096
    idle_timeout_seconds: 600
    tags: [general, tools, long-context]
    description: 32k-context instruct model with tool support
    cost_tier: 4
    # Memory-aware admission (ADR 0022, opt-in): declared resident footprint in
    # MiB. With BROKER_GPU_TELEMETRY on this is checked against measured free VRAM
    # (minus headroom); with telemetry off it is checked against the declared
    # BROKER_GPU_MEMORY_BUDGET_MIB for device 0. Omit to keep count-only behavior.
    memory_mib: 18000
    startup_command:
      - /usr/local/bin/vllm
      - serve
      - "{model_path}"
      - --host
      - 127.0.0.1
      - --port
      - "8000"
      - --max-model-len
      - "{context_limit}"
      - --tensor-parallel-size
      - "{tensor_parallel_size}"
      - --gpu-memory-utilization
      - "{gpu_memory_fraction}"
    readiness:
      kind: http
      path: /health
      expect_status: 200
      timeout_seconds: 300
    gpu:
      # required: true is ENFORCED (ADR 0025). This is a broker-managed runtime
      # (startup_command present), so placement is verified after load: with
      # BROKER_GPU_TELEMETRY on, the process group must hold memory on device 0
      # within BROKER_GPU_VERIFY_SECONDS, else the model is unloaded and the
      # request fails 503 gpu_placement_failed. With telemetry off, device 0 must
      # be in the declared inventory (BROKER_GPU_DEVICES / BROKER_CUDA_VISIBLE_DEVICES)
      # or the load fails 503 gpu_unavailable before spawning. No CPU fallback.
      required: true
      device_ids: [0]
      tensor_parallel_size: 1
      gpu_memory_fraction: 0.9
    supports_streaming: true
    supports_tools: true

  # ---- External OpenAI-compatible endpoint (no startup_command) -------------
  # The broker owns no lifecycle here, so it cannot verify GPU placement. Setting
  # gpu.required: true on such an entry is a STARTUP CONFIG ERROR unless you also
  # set gpu.verify: declared — an explicit operator statement that the endpoint is
  # GPU-backed out-of-band. It then shows as `declared` in /status (ADR 0025).
  # - alias: remote-vllm
  #   backend: vllm
  #   runtime_model_id: meta-llama/Llama-3.1-8B-Instruct
  #   base_url: http://gpu-host.internal:8000   # external; no startup_command
  #   gpu:
  #     required: true
  #     verify: declared

  # ---- Strata (broker-managed; flags are deployment-specific/UNVERIFIED) ----
  # Fill startup_command/readiness from your confirmed Strata version. See
  # docs/backends/strata.md — do NOT assume flags.
  - alias: strata-model
    backend: strata
    runtime_model_id: strata-default
    model_path: /models/strata-default
    base_url: http://127.0.0.1:8090
    context_limit: 8192
    output_limit: 2048
    idle_timeout_seconds: 600
    router_eligible: false       # exclude from "auto" until this backend is verified
    startup_command:
      - /opt/strata/bin/strata-server
      - --model-path
      - "{model_path}"
      - --port
      - "8090"
    readiness:
      kind: http
      path: /health
      expect_status: 200
      timeout_seconds: 300
    gpu:
      required: true
      device_ids: [0]
    mtp:
      enabled: false
    supports_streaming: true

  # ---- Load-balancing POOL (multiple hosts serving one logical model) -------
  # Give several entries the SAME `pool` name and clients call that pool name as
  # the model. Default routing is STICKY: each session (X-Session-Id header, else
  # the OpenAI `user` field, else client IP) is pinned 1:1 to a member and only
  # moves if that member is down — new sessions get the least-busy member, so
  # distinct sessions still spread. Set BROKER_ROUTE_STRATEGY=least_busy (or
  # round_robin) to rebalance every request. Failover is automatic. Members may be
  # different hosts or even different backends; keep real host IPs in env vars.
  # Router metadata (tags/cost_tier/...) set on the members applies to the pool
  # (capabilities are ANDed, cost_tier min-ed, priority max-ed across members).
  - alias: chat-pool-node-1
    backend: ollama
    runtime_model_id: llama3.1:8b
    pool: chat             # <- clients request model: "chat"
    base_url: ${OLLAMA_URL_1:-http://127.0.0.1:11434}
    readiness: { kind: http, path: /api/tags, expect_status: 200 }
    idle_timeout_seconds: 300
    tags: [general, chat]
    description: pooled general chat model
    cost_tier: 2
    supports_streaming: true
  - alias: chat-pool-node-2
    backend: ollama
    runtime_model_id: llama3.1:8b
    pool: chat             # <- same pool -> same public model name
    base_url: ${OLLAMA_URL_2:-http://127.0.0.1:11434}
    readiness: { kind: http, path: /api/tags, expect_status: 200 }
    idle_timeout_seconds: 300
    tags: [general, chat]
    description: pooled general chat model
    cost_tier: 2
    supports_streaming: true
