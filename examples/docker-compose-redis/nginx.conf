# Minimal nginx load balancer in front of two broker replicas. Round-robins by
# default; the broker's own sticky routing (shared via Redis) keeps each session
# pinned to a backend member regardless of which replica handles the HTTP request.
events {}
http {
  upstream brokers {
    server broker-1:8080;
    server broker-2:8080;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://brokers;
      proxy_set_header Host $host;
      # Preserve the broker's session header for sticky routing.
      proxy_set_header X-Session-Id $http_x_session_id;
      proxy_read_timeout 300s;
    }
  }
}
