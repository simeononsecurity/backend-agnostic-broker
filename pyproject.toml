[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-agnostic-broker"
version = "0.5.0"
description = "Backend-agnostic local AI broker (OpenAI-compatible) for Strata, Ollama, vLLM, llama.cpp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "fakeredis[lua]>=2",
    "opentelemetry-sdk>=1.20",
]
# Optional: shared routing/runtime state across replicas (ADR 0009). Absent this
# extra the broker runs exactly as before with in-process state.
redis = [
    "redis>=5",
]
# Optional: OpenTelemetry distributed tracing (ADR 0012). Absent this extra,
# tracing is a no-op; enabling BROKER_TRACING_ENABLED without it fails fast with
# a ConfigError. Spans carry gen_ai.* metadata only — never prompt/response
# content. The OTLP exporter is configured via standard OTEL_* env vars.
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
broker = "broker.__main__:main"

[tool.setuptools.packages.find]
include = ["broker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
